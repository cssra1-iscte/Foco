<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ebe7fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foco">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Foco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm personal planner, friendly, focused
   IDEA: the reference app — pastel stat tiles, floating pill nav
   PICTURE: the working app itself, phone-width column
   COLOUR and TYPE: lavender ground, violet #5b4cf0 accent, pastel area tints; Plus Jakarta Sans
   LAYOUT: single 480px column, sticky floating nav, bottom sheets */
:root{color-scheme:light;
--bg:#f4f2fb;--bg2:#ebe7fb;
--card:#ffffff;--ink:#16141f;--mut:#6f6b80;
--line:#e7e4f0;--acc:#5b4cf0;--acc2:#ece9ff;
--hi:#e5484d;--mid:#e39b2b;--lo:#1fa58a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 18px 130px;
background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 260px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.top small{display:block;color:var(--mut);font-size:13px}
.top b{font-size:16px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px}
.sp{flex:1}
h1{font-size:30px;line-height:1.1;margin:0 0 18px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between}
h2 button{font-size:13px;color:var(--acc);font-weight:600;min-height:32px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{border-radius:20px;padding:14px;text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;position:relative;border:1.5px solid transparent}
.st.on{border-color:currentColor}
.st span{font-size:13px;font-weight:600}
.st b{font-size:40px;line-height:1;font-weight:700}
.st b small{font-size:13px;font-weight:500;margin-left:4px}
.st i{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:10px;background:var(--card);display:grid;place-items:center}
.st i svg{width:16px;height:16px}
.c1{background:#e6e3ff;color:#4338ca}
.c2{background:#fbe3f3;color:#be2d8f}
.c3{background:#dcf3ec;color:#127a62}
.c4{background:#fcefd9;color:#b0700d}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.gc{flex:0 0 78%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-alta{background:#fde4e4;color:var(--hi)}
.p-media{background:#fcefd9;color:var(--mid)}
.p-baixa{background:#dcf3ec;color:var(--lo)}
.gc h3{font-size:15px;margin:10px 0 12px;display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:6px;background:var(--acc2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:6px}
.bm b{color:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tab{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap;min-height:38px}
.tab.on{background:var(--acc2);color:var(--acc);border-color:transparent}
.list{display:grid;gap:10px}
.it{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;min-height:64px}
.it .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.it .ck.d{background:var(--acc);border-color:var(--acc);color:#fff}
.it .ck svg{width:14px;height:14px}
.it .ty{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.it .ty svg{width:17px;height:17px}
.it .bd{flex:1;text-align:left}
.it .tt{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.done .tt{text-decoration:line-through;color:var(--mut)}
.it .mt{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:26px 12px;background:var(--card);border:1px dashed var(--line);border-radius:18px;font-size:14px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);background:var(--acc);border-radius:99px;padding:7px;display:flex;gap:4px;box-shadow:0 10px 30px -8px rgba(70,50,200,.55);z-index:5}
.nav button{width:46px;height:46px;border-radius:99px;display:grid;place-items:center;color:rgba(255,255,255,.72)}
.nav button.on{background:rgba(255,255,255,.2);color:#fff}
.nav button.add{background:#fff;color:var(--acc);border-radius:16px;width:50px}
.nav svg{width:21px;height:21px}
/* calendar */
.mh{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.mh b{font-size:22px;flex:1;text-transform:capitalize}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:18px}
.wd{border-radius:16px;padding:8px 0 16px;text-align:center;color:var(--mut);min-height:70px;position:relative}
.wd small{display:block;font-size:12px}
.wd b{font-size:17px;color:var(--ink)}
.wd.on{background:var(--acc);color:#fff}.wd.on b{color:#fff}
.wd.td:not(.on) b{color:var(--acc)}
.wd u{position:absolute;bottom:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
.wd.on u{background:#fff}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;margin-bottom:18px}
.month small{text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.md{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:14px;position:relative}
.md.out{color:var(--mut);opacity:.45}
.md.on{background:var(--acc);color:#fff}
.md.td:not(.on){color:var(--acc);background:var(--acc2)}
.md u{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.md.on u{background:#fff}
.tl{display:grid;grid-template-columns:62px 1fr;gap:0 10px}
.tl .h{font-size:12px;color:var(--mut);padding-top:2px;white-space:nowrap}
.tl .h.now{color:#fff}
.tl .h.now span{background:var(--acc);border-radius:99px;padding:2px 8px}
.tl .s{border-left:2px dotted var(--line);padding:0 0 14px 12px;min-height:34px;display:grid;gap:8px;align-content:start}
.ev{border-radius:16px;padding:10px 12px;text-align:left;display:block;width:100%}
.ev b{display:block;font-size:14px}
.ev small{font-size:12px;opacity:.8}
.evw{display:flex;gap:8px;align-items:center}.evw .ev{flex:1;min-width:0}.evw .rdn{background:var(--card)}.evw .rdn.d{background:var(--acc)}
/* areas */
.ag{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ac{border-radius:20px;padding:14px;text-align:left;min-height:130px;display:flex;flex-direction:column;gap:6px}
.ac b{font-size:16px;color:var(--ink)}
.ac small{color:var(--mut);font-size:12px}
.ac .bar{margin-top:auto;background:rgba(127,127,127,.18)}
.ac.new{border:1.5px dashed var(--line);background:transparent;align-items:center;justify-content:center;color:var(--mut);font-weight:600}
/* detail */
.dt h1{margin:12px 0 16px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.dates div{display:flex;gap:10px;align-items:center}
.dates i{width:36px;height:36px;border-radius:11px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;flex:none}
.dates i svg{width:18px;height:18px}
.dates small{display:block;color:var(--mut);font-size:12px}
.dates b{font-size:14px}
.txt{color:var(--mut);white-space:pre-wrap;margin:0}
.ring{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.ring svg{width:64px;height:64px;flex:none}
.sub{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 12px}
.sub label{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sub label:last-child{border:0}
.sub input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.sub .x{text-decoration:line-through;color:var(--mut)}
.acts{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;min-height:50px;border-radius:16px;background:var(--acc);color:#fff;font-weight:700}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.r{background:#fde4e4;color:var(--hi);flex:0 0 56px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:11px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(15,12,35,.45);z-index:9;display:flex;align-items:flex-end;justify-content:center;animation:f .2s}
.sh{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;animation:u .25s ease-out}
.sh .gr{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh h3{margin:0 0 14px;font-size:19px}
.fl{display:grid;gap:6px;margin-bottom:14px}
.fl>span{font-size:13px;font-weight:600;color:var(--mut)}
.in{width:100%;min-height:46px;border-radius:13px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px}
textarea.in{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--ink)}
.subed{display:flex;gap:8px;margin-bottom:6px}
.subed .in{flex:1}
.subed button{width:44px;border-radius:12px;background:var(--bg2);flex:none}
.welcome{text-align:center;padding-top:30px}
.welcome .art{height:240px;position:relative;margin:10px auto 26px;max-width:320px}
.welcome .art div{position:absolute;border-radius:20px;padding:14px;text-align:left;box-shadow:0 14px 30px -14px rgba(70,50,200,.4)}
.welcome h1{font-size:28px}
.welcome p{color:var(--mut);max-width:330px;margin:0 auto 26px}
.sync{font-size:12px;color:var(--mut);text-align:center;margin-top:28px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;white-space:nowrap}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kp div{border-radius:20px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.kp span{font-size:13px;font-weight:600}
.kp b{font-size:32px;line-height:1;font-weight:700}
.kp b small{font-size:13px;font-weight:500;margin-left:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:8px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.cols i{display:block;width:100%;max-width:26px;background:var(--acc);border-radius:6px 6px 3px 3px;min-height:3px}
.cols i.z{background:var(--acc2)}
.cols em{font-style:normal;font-size:11px;color:var(--mut);white-space:nowrap}
.cols strong{font-size:11px;color:var(--acc)}
.hr{display:grid;gap:12px}
.hr .l{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:14px;margin-bottom:6px}
.hr .l b{display:flex;gap:8px;align-items:center;font-weight:600}
.hr .l span{color:var(--mut);white-space:nowrap;font-size:13px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none;align-self:flex-start;line-height:1.5}
.ok{background:#dcf3ec;color:#127a62}.late{background:#fde4e4;color:var(--hi)}.nd{background:var(--acc2);color:var(--acc)}
.emg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.emg button{aspect-ratio:1;border-radius:10px;font-size:21px;line-height:1;display:grid;place-items:center;background:var(--bg)}
.emg button.on{background:var(--acc2);outline:2px solid var(--acc)}
.emg button.no{font-size:22px;color:var(--mut);font-weight:500}
.em{font-style:normal;margin-right:6px}
.wd .ems{position:absolute;bottom:3px;left:0;right:0;font-size:11px;line-height:1;white-space:nowrap;overflow:hidden;letter-spacing:-2px}
.md .ems{position:absolute;bottom:1px;font-size:10px;line-height:1}
/* routines */
.rdn{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);color:#c9c6dc;display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.rdn svg{width:16px;height:16px}
.rdn.d{background:var(--acc);border-color:var(--acc);color:#fff}
.rdn:disabled{opacity:.35}
.list.rl{gap:6px}
.it.rs{width:100%;min-height:0;padding:8px 12px;margin-bottom:12px;text-align:left}.it.rs>svg{width:18px;height:18px;color:var(--mut);flex:none}.it.rs .rdn{width:28px;height:28px}.it.rs .rdn svg{width:14px;height:14px}
.rp{font-size:13px;font-weight:700;color:var(--acc);background:var(--acc2);border-radius:99px;padding:4px 10px;flex:none}
.it.rc{min-height:0;padding:5px 5px 5px 14px;border-radius:14px;gap:8px}
.it.rc .tt{font-size:14px}
.it.rc .fl{font-size:12px;color:var(--mut);flex:none;font-weight:600;display:flex;align-items:center;line-height:1}
.it.rc .rdn{width:32px;height:32px}
.it.rc.done{background:var(--bg)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk button{min-height:42px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-weight:700;color:var(--mut)}
.wk button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,minmax(0,1fr));grid-template-columns:14px;grid-auto-columns:minmax(0,1fr);gap:3px}
.hm small{font-size:10px;color:var(--mut);line-height:1;display:grid;place-items:center}
.hm button,.hm span{aspect-ratio:1;border-radius:5px;background:var(--bg)}
.hm button.td{outline:2px solid var(--ink);outline-offset:-1px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@keyframes u{from{transform:translateY(40px);opacity:0}}@keyframes f{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.ov,.sh{animation:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<script>
{
const COLORS=['#5b4cf0','#e05aa8','#1fa58a','#e39b2b','#3b82f6','#ef6a5a','#8b5cf6','#64748b'];
const I={
home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
grid:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
back:'<path d="M15 5l-7 7 7 7"/>',fwd:'<path d="M9 5l7 7-7 7"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
task:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
event:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
chart:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
loop:'<path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/>'};
const ic=(n,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MON=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmt=s=>{if(!s)return'';const d=parse(s);return`${d.getDate()} ${MON[d.getMonth()].slice(0,3)} ${d.getFullYear()}`};
const fmtS=s=>{if(!s)return'';if(s===today())return'Hoje';if(s===addD(today(),1))return'Amanhã';const d=parse(s);return`${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`};
const fmtDur=m=>{m=+m||0;if(!m)return'';const h=Math.floor(m/60),r=m%60;return h?(h+'h'+(r?' '+pad(r)+'m':'')):r+'m'};
const addMin=(t,m)=>{const[h,x]=t.split(':').map(Number);const v=(h*60+x+(+m||0))%1440;return pad(Math.floor(v/60))+':'+pad(v%60)};
const endOf=i=>i.end||(i.type==='task'&&i.time&&i.dur?addMin(i.time,i.dur):'');
const EMO=['📚','💻','📝','🧠','🎓','💼','📞','✉️','🏃‍♀️','💪','🧘‍♀️','🚴','🍎','💧','☕','🍳','🛒','🧹','🏠','🧺','💰','📈','🎯','⭐','🎨','🎵','📖','🎮','✈️','🚗','🐶','🌱','❤️','👯‍♀️','🎉','🎂','🩺','💊','🛏️','📅'];

const area=id=>S.areas.find(a=>a.id===id);
const acol=id=>(area(id)||{}).color||'#64748b';
const tint=(c,p)=>`color-mix(in srgb,${c} ${p||14}%,var(--card))`;
const isDone=i=>i.status==='done';
function goalProg(g){
  const kids=S.items.filter(i=>i.goalId===g.id&&i.type==='task');
  const subs=g.subs||[];
  const tot=kids.length+subs.length,dn=kids.filter(isDone).length+subs.filter(s=>s.d).length;
  if(!tot)return{p:isDone(g)?100:0,dn:isDone(g)?1:0,tot:1};
  return{p:Math.round(dn/tot*100),dn,tot};
}
function setSt(i,st){i.status=st;i.doneAt=st==='done'?(i.doneAt||today()):''}
/* ---------- routines ---------- */
const rDays=r=>r.days&&r.days.length?r.days:[0,1,2,3,4,5,6];
const dueOn=(r,s)=>s>=(r.start||'')&&rDays(r).includes(parse(s).getDay());
const rCol=r=>r.areaId&&area(r.areaId)?acol(r.areaId):'#5b4cf0';
const rGet=id=>S.routines.find(r=>r.id===id);
// stats for one routine; `from` bounds the rate window and the period count (default: last 30 days)
function rStats(r,from){
  const t=today(),log=r.log||{};
  const keys=Object.keys(log).filter(k=>log[k]&&k<=t).sort();
  let first=r.start||t;if(keys[0]&&keys[0]<first)first=keys[0];if(first>t)first=t;
  let cur=0,d=log[t]?t:addD(t,-1);
  while(d>=first){if(log[d])cur++;else if(dueOn(r,d))break;d=addD(d,-1)}
  let best=0,run=0;
  for(let x=first;x<=t;x=addD(x,1)){if(log[x]){run++;if(run>best)best=run}else if(dueOn(r,x)&&x!==t)run=0}
  from=from||addD(t,-29);const w0=from>first?from:first;let sc=0,dn=0;
  for(let x=w0;x<=t;x=addD(x,1))if(dueOn(r,x)&&(x!==t||log[x])){sc++;if(log[x])dn++}
  return{total:keys.length,cur,best,sc,dn,rate:sc?Math.round(dn/sc*100):0,first,
    since:Math.round((parse(t)-parse(first))/864e5)+1,inP:keys.filter(k=>k>=from).length};
}
const daysTxt=r=>{const d=rDays(r);if(d.length===7)return'Todos os dias';if(d.length===5&&!d.includes(0)&&!d.includes(6))return'Dias úteis';if(d.length===2&&d.includes(0)&&d.includes(6))return'Fim de semana';return[1,2,3,4,5,6,0].filter(k=>d.includes(k)).map(k=>DOW[k]).join(', ')};
const nDias=n=>n+' '+(n===1?'dia':'dias');
const itemsOn=d=>S.items.filter(i=>i.type!=='goal'&&i.date===d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));

/* ---------- pieces ---------- */
const evBtn=i=>`<button class="rdn ${isDone(i)?'d':''}" data-a="tog" data-id="${i.id}" aria-label="${isDone(i)?'Desmarcar evento':'Marcar evento como feito'}" aria-pressed="${isDone(i)}">${ic('check',3)}</button>`;
function row(i){
  const c=acol(i.areaId),a=area(i.areaId);
  const lead=i.type==='task'
    ?`<button class="ck ${isDone(i)?'d':''}" data-a="tog" data-id="${i.id}" aria-label="Marcar como concluída">${isDone(i)?ic('check',3):''}</button>`
    :`<span class="ty" style="background:${tint(c,18)};color:${c}">${ic(i.type==='event'?'event':'target')}</span>`;
  const when=[fmtS(i.date),i.time?(i.time+(endOf(i)?'–'+endOf(i):'')):'',i.type==='task'&&i.dur&&!i.time?'⏱ '+fmtDur(i.dur):''].filter(Boolean).join(' · ');
  return`<div class="it ${i.type!=='goal'&&isDone(i)?'done':''}">${lead}
  <button class="bd" data-a="open" data-id="${i.id}"><span class="tt">${em(i)}${esc(i.title)}</span>

  ${i.priority==='alta'&&!isDone(i)?'<span class="chip p-alta">Alta</span>':''}${i.type==='event'?evBtn(i):''}</div>`;
}
function goalCard(g){
  const p=goalProg(g),c=acol(g.areaId),a=area(g.areaId);
  return`<button class="gc" data-a="open" data-id="${g.id}">
  <div class="chips"><span class="chip p-${g.priority}">${PL[g.priority]}</span>${g.due?`<span class="chip" style="background:var(--acc2);color:var(--acc)">${fmt(g.due)}</span>`:''}</div>

  <div class="bm"><span>${a?esc(a.name):'Sem área'}</span><b>${p.dn} de ${p.tot}</b></div>
  <div class="bar"><i style="width:${p.p}%"></i></div></button>`;
}
function rRow(r,d,cmp){
  d=d||today();const s=rStats(r),dn=!!(r.log||{})[d],c=rCol(r);
  const g=r.goalId&&S.items.find(x=>x.id===r.goalId);
  // round Done button with a check mark; disabled for future days
  const btn=`<button class="rdn ${dn?'d':''}" data-a="rTog" data-id="${r.id}" data-d="${d}" ${d>today()?'disabled':''} aria-label="${dn?'Desmarcar rotina':'Marcar rotina como feita'}" aria-pressed="${dn}">${ic('check',3)}</button>`;
  if(cmp)return`<div class="it rc ${dn?'done':''}"><button class="bd" data-a="rOpen" data-id="${r.id}"><span class="tt">${em(r)}${esc(r.title)}</span></button>${s.cur?`<span class="fl">🔥${s.cur}</span>`:''}${btn}</div>`;
  return`<div class="it ${dn?'done':''}"><span class="ty" style="background:${tint(c,18)};color:${c}">${ic('loop')}</span>
  <button class="bd" data-a="rOpen" data-id="${r.id}"><span class="tt">${em(r)}${esc(r.title)}</span>
  <span class="mt"><span>🔥 ${nDias(s.cur)} seguidos</span><span>${s.total} praticados</span>${g?`<span>🎯 ${esc(g.title)}</span>`:''}</span></button>${btn}</div>`;
}

  ${i.type==='event'?`<h2>Estado</h2><div class="seg" style="grid-template-columns:1fr 1fr">${['todo','done'].map(s=>`<button class="${(isDone(i)?'done':'todo')===s?'on':''}" data-a="stat" data-s="${s}">${s==='done'?'Feito':'Por fazer'}</button>`).join('')}</div>`:''}
  ${i.type!=='event'?`<h2>Estado</h2><div class="seg">${['todo','doing','done'].map(s=>`<button class="${i.status===s?'on':''}" data-a="stat" data-s="${s}">${i.type==='goal'&&s==='done'?'Alcançado':SL[s]}</button>`).join('')}</div>`:''}
  <div class="acts"><button class="btn r" data-a="del" aria-label="Apagar">${ic('trash')}</button><button class="btn" data-a="edit">Editar</button></div></div>`;
}

/* ---------- sheets ---------- */
function sheetHTML(){
  const s=ui.sheet;if(!s)return'';
  if(s.kind==='confirm')return`<div class="ov" data-a="shx"><div class="sh" data-stop><div class="gr"></div><h3>${esc(s.title)}</h3><p class="txt" style="margin-bottom:18px">${esc(s.text)}</p><div class="acts" style="margin:0"><button class="btn g" data-a="shx">Cancelar</button><button class="btn" style="background:var(--hi)" data-a="ok">${esc(s.ok)}</button></div></div></div>`;
  if(s.kind==='bk')return`<div class="ov" data-a="shx"><div class="sh" data-stop><div class="gr"></div><h3>Cópia de segurança</h3>
  <p class="txt" style="margin-bottom:16px">Os dados ficam guardados neste dispositivo. Exporta um ficheiro para não os perderes ou para os passares para outro telemóvel ou computador.</p>
  <div style="display:grid;gap:10px"><button class="btn" data-a="exp">Exportar dados</button>
  <label class="btn g" style="display:grid;place-items:center;cursor:pointer">Importar ficheiro<input type="file" accept=".json,application/json" id="imp" hidden></label></div></div></div>`;
  if(s.kind==='name')return`<div class="ov" data-a="shx"><div class="sh" data-stop><div class="gr"></div><h3>Como te chamas?</h3><form data-f="name"><label class="fl"><span>Nome</span><input class="in" name="n" value="${esc(S.name||'')}" maxlength="40" autofocus></label><button class="btn" style="width:100%">Guardar</button></form></div></div>`;
  if(s.kind==='area'){const a=s.d;return`<div class="ov" data-a="shx"><div class="sh" data-stop><div class="gr"></div><h3>${a.id?'Editar área':'Nova área'}</h3>
    <form data-f="area"><label class="fl"><span>Nome</span><input class="in" name="n" value="${esc(a.name)}" required maxlength="40" placeholder="Ex.: Saúde"></label>
    <div class="fl"><span>Cor</span><div class="sw">${COLORS.map(c=>`<button type="button" class="${a.color===c?'on':''}" style="background:${c}" data-a="col" data-c="${c}" aria-label="Cor ${c}"></button>`).join('')}</div></div>
    <div class="acts">${a.id?`<button type="button" class="btn r" data-a="areaDel" aria-label="Apagar área">${ic('trash')}</button>`:''}<button class="btn">Guardar</button></div></form></div></div>`}
  const segT=cur=>`<div class="seg" style="margin-bottom:16px;grid-template-columns:repeat(4,1fr)">${['task','event','goal','routine'].map(t=>`<button type="button" class="${cur===t?'on':''}" data-a="ty" data-t="${t}">${TL[t]}</button>`).join('')}</div>`;
  const emoB=d=>`<div class="fl"><span>Emoji</span><div class="emg"><button type="button" class="no ${d.emoji?'':'on'}" data-a="emo" data-e="" aria-label="Sem emoji" title="Sem emoji">ø</button>${EMO.map(e=>`<button type="button" class="${d.emoji===e?'on':''}" data-a="emo" data-e="${e}" aria-label="Emoji ${e}">${e}</button>`).join('')}</div>
  <input class="in" name="emoji" value="${esc(d.emoji||'')}" maxlength="16" placeholder="Ou escreve/cola outro emoji" style="margin-top:6px"></div>`;
  const areaB=d=>`<label class="fl"><span>Área</span><select class="in" name="areaId"><option value="">Sem área</option>${S.areas.map(a=>`<option value="${a.id}" ${d.areaId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label>`;
  if(s.kind==='routine'){const d=s.d,goals=S.items.filter(g=>g.type==='goal'&&(!isDone(g)||g.id===d.goalId));
    return`<div class="ov" data-a="shx"><div class="sh" data-stop><div class="gr"></div><h3>${d.id?'Editar':'Nova'} rotina</h3>
    ${d.id?'':segT('routine')}
    <form data-f="routine">
    <label class="fl"><span>Título</span><input class="in" name="title" value="${esc(d.title)}" required maxlength="120" placeholder="Ex.: Ler 20 minutos"></label>
    ${emoB(d)}${areaB(d)}
    <label class="fl"><span>Ligada ao objetivo</span><select class="in" name="goalId"><option value="">Nenhum</option>${goals.map(g=>`<option value="${g.id}" ${d.goalId===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select></label>
    <div class="fl"><span>Dias da semana</span><div class="wk">${[1,2,3,4,5,6,0].map(k=>`<button type="button" class="${d.days.includes(k)?'on':''}" data-a="rday" data-k="${k}" aria-pressed="${d.days.includes(k)}" aria-label="${DOW[k]}">${DOW[k][0]}</button>`).join('')}</div>
    <div class="chips" style="margin-top:4px">${[['all','Todos os dias'],['wk','Dias úteis'],['we','Fim de semana']].map(([v,l])=>`<button type="button" class="tab" style="min-height:34px;padding:5px 12px" data-a="rdays" data-v="${v}">${l}</button>`).join('')}</div></div>
    <label class="fl"><span>Começa em</span><input class="in" type="date" name="start" value="${d.start||''}"></label>
    <label class="fl"><span>Descrição</span><textarea class="in" name="notes" maxlength="2000">${esc(d.notes||'')}</textarea></label>
    <button class="btn" style="width:100%;margin-top:6px">Guardar</button></form></div></div>`}
  const d=s.d,goals=S.items.filter(g=>g.type==='goal'&&g.id!==d.id);
  return`<div class="ov" data-a="shx"><div class="sh" data-stop><div class="gr"></div><h3>${d.id?'Editar':'Novo'} ${TL[d.type].toLowerCase()}</h3>
  ${d.id?'':segT(d.type)}
  <form data-f="item">
  <label class="fl"><span>Título</span><input class="in" name="title" value="${esc(d.title)}" required maxlength="120" placeholder="${d.type==='goal'?'Ex.: Aprender a tocar guitarra':d.type==='event'?'Ex.: Consulta no dentista':'Ex.: Enviar relatório'}"></label>
  ${emoB(d)}${areaB(d)}
  <div class="row2"><label class="fl"><span>${d.type==='goal'?'Início':'Data'}</span><input class="in" type="date" name="date" value="${d.date||''}"></label>
  ${d.type==='goal'?`<label class="fl"><span>Prazo</span><input class="in" type="date" name="due" value="${d.due||''}"></label>`:`<label class="fl"><span>${d.type==='event'?'Início':'Hora'}</span><input class="in" type="time" name="time" value="${d.time||''}"></label>`}</div>
  ${d.type==='task'?`<div class="fl"><span>Duração</span><div class="row2"><label style="display:flex;align-items:center;gap:8px"><input class="in" type="number" inputmode="numeric" min="0" max="23" name="durH" value="${Math.floor((+d.dur||0)/60)||''}" placeholder="0" aria-label="Horas"><span style="color:var(--mut)">h</span></label><label style="display:flex;align-items:center;gap:8px"><input class="in" type="number" inputmode="numeric" min="0" max="59" step="5" name="durM" value="${(+d.dur||0)%60||''}" placeholder="0" aria-label="Minutos"><span style="color:var(--mut)">min</span></label></div><div class="chips" style="margin-top:4px">${[15,30,45,60,90,120].map(m=>`<button type="button" class="tab" style="min-height:34px;padding:5px 12px" data-a="dur" data-m="${m}">${fmtDur(m)}</button>`).join('')}</div></div>`:''}
  ${d.type==='event'?`<div class="row2"><span></span><label class="fl"><span>Fim</span><input class="in" type="time" name="end" value="${d.end||''}"></label></div>`:''}
  <label class="fl"><span>Prioridade</span><select class="in" name="priority">${['alta','media','baixa'].map(p=>`<option value="${p}" ${d.priority===p?'selected':''}>${PL[p].replace(' prioridade','')}</option>`).join('')}</select></label>
  ${d.type==='task'&&goals.length?`<label class="fl"><span>Contribui para o objetivo</span><select class="in" name="goalId"><option value="">Nenhum</option>${goals.map(g=>`<option value="${g.id}" ${d.goalId===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select></label>`:''}
  <label class="fl"><span>Descrição</span><textarea class="in" name="notes" maxlength="2000">${esc(d.notes||'')}</textarea></label>
  <div class="fl"><span>Checklist</span>${(d.subs||[]).map((x,k)=>`<div class="subed"><input class="in" data-sub="${k}" value="${esc(x.t)}" maxlength="120"><button type="button" data-a="subDel" data-k="${k}" aria-label="Remover">${ic('trash')}</button></div>`).join('')}
  <button type="button" class="tab" style="justify-self:start" data-a="subAdd">+ Adicionar passo</button></div>
  <button class="btn" style="width:100%;margin-top:6px">Guardar</button></form></div></div>`;
}
function newItem(o){return Object.assign({id:'',type:'task',title:'',areaId:ui.area||'',date:ui.view==='cal'?ui.day:today(),time:'',end:'',due:'',priority:'media',status:'todo',goalId:'',dur:0,emoji:'',notes:'',subs:[]},o||{})}
function newRoutine(o){return Object.assign({id:'',title:'',emoji:'',areaId:ui.area||'',goalId:'',days:[0,1,2,3,4,5,6],start:today(),notes:'',log:{}},o||{})}
function readForm(){
  const f=document.querySelector('form[data-f=item],form[data-f=routine]');if(!f)return;const d=ui.sheet.d;
  const fd=new FormData(f);for(const[k,v]of fd)d[k]=v;
  if(f.dataset.f==='routine')return;
  if('durH' in d||'durM' in d){d.dur=Math.min(1439,Math.max(0,(parseInt(d.durH)||0)*60+(parseInt(d.durM)||0)));delete d.durH;delete d.durM}
  d.subs=[...f.querySelectorAll('[data-sub]')].map((el,k)=>({t:el.value,d:(d.subs[k]||{}).d||false}));
}

/* ---------- render ---------- */
const app=document.getElementById('app'),layer=document.getElementById('layer');
function render(){
  if(!S){app.innerHTML=vWelcome();layer.innerHTML='';return}
  const det=(ui.rt&&vRoutine())||(ui.detail&&vDetail());
  const views={home:vHome,cal:vCal,areas:vAreas,goals:vGoals,stats:vStats,routines:vRoutines};
  app.innerHTML=(det||views[ui.view]())+'';
  const nb=(v,n,l)=>`<button class="${ui.view===v&&!det?'on':''}" data-a="go" data-v="${v}" aria-label="${l}">${ic(n)}</button>`;
  layer.innerHTML=`<nav class="nav">${nb('home','home','Início')}${nb('cal','cal','Calendário')}${nb('areas','grid','Áreas')}<button class="add" data-a="new" aria-label="Adicionar">${ic('plus',2.5)}</button>${nb('goals','target','Objetivos')}${nb('stats','chart','Estatísticas')}</nav>`+sheetHTML();
}
let tt;function toast(m){clearTimeout(tt);let e=document.querySelector('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e)}e.textContent=m;tt=setTimeout(()=>e.remove(),2200)}
function commit(msg){save();render();if(msg)toast(msg)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.matches('.ov')&&e.target.closest('[data-stop]'))return;
  const a=b.dataset.a,id=b.dataset.id;
  const cur=()=>S.items.find(x=>x.id===ui.detail);
  switch(a){
    case'start':start(false);break;case'startS':start(true);break;
    case'go':if(ui.view!==b.dataset.v||ui.detail||ui.area||ui.rt)nav({view:b.dataset.v,detail:null,area:null,rt:null});break;
    case'back':goBack();break;
    case'filt':ui.filter=b.dataset.f;render();break;
    case'open':nav({detail:id,rt:null});break;
    case'tog':{const i=S.items.find(x=>x.id===id);setSt(i,isDone(i)?'todo':'done');commit(isDone(i)?(i.type==='event'?'Feito ✓':'Concluída ✓'):'');break}
    case'stat':{const i=cur();setSt(i,b.dataset.s);commit(i.type==='goal'&&isDone(i)?'Objetivo alcançado 🎉':i.type==='event'&&isDone(i)?'Feito ✓':'');break}
    case'sub':{const i=cur();i.subs[+b.dataset.k].d=b.checked;commit();break}
    case'del':ui.sheet={kind:'confirm',title:'Apagar este item?',text:'Esta ação não pode ser desfeita.',ok:'Apagar',fn:()=>{S.items=S.items.filter(x=>x.id!==ui.detail);S.items.forEach(x=>{if(x.goalId===ui.detail)x.goalId=''});S.routines.forEach(x=>{if(x.goalId===ui.detail)x.goalId=''});ui.detail=null;if(stack.length)try{history.back()}catch(e){stack.pop()}}};render();break;
    case'ok':{const{fn,msg}=ui.sheet;ui.sheet=null;fn();commit(msg||'Apagado');break}
    case'edit':ui.sheet={kind:'item',d:JSON.parse(JSON.stringify(Object.assign(newItem(),cur())))};render();break;
    case'new':ui.sheet={kind:'item',d:newItem({type:b.dataset.t||'task',date:b.dataset.d||(ui.view==='cal'?ui.day:today()),areaId:b.dataset.area||(b.dataset.goal?(S.items.find(g=>g.id===b.dataset.goal)||{}).areaId:'')||ui.area||'',goalId:b.dataset.goal||''})};render();break;
    case'ty':{readForm();const d=ui.sheet.d,t=b.dataset.t,base={title:d.title,emoji:d.emoji,areaId:d.areaId,goalId:d.goalId,notes:d.notes};
      if(t==='routine'){if(ui.sheet.kind!=='routine')ui.sheet={kind:'routine',d:newRoutine(base)}}
      else if(ui.sheet.kind==='routine')ui.sheet={kind:'item',d:newItem(Object.assign(base,{type:t}))};
      else d.type=t;render();break}
    case'rOpen':nav({rt:id});break;
    case'rTog':{const r=rGet(id),d=b.dataset.d;if(!r||d>today())break;r.log=r.log||{};
      if(r.log[d])delete r.log[d];else r.log[d]=true;
      commit(r.log[d]&&d===today()?`Feito ✓ · 🔥 ${nDias(rStats(r).cur)} seguidos`:'');break}
    case'rNew':{const g=b.dataset.goal&&S.items.find(x=>x.id===b.dataset.goal);ui.sheet={kind:'routine',d:newRoutine({goalId:g?g.id:'',areaId:(g&&g.areaId)||ui.area||''})};render();break}
    case'rEdit':ui.sheet={kind:'routine',d:JSON.parse(JSON.stringify(Object.assign(newRoutine(),rGet(ui.rt))))};render();break;
    case'rDel':ui.sheet={kind:'confirm',title:'Apagar esta rotina?',text:'O histórico de dias praticados também será apagado.',ok:'Apagar',fn:()=>{S.routines=S.routines.filter(x=>x.id!==ui.rt);ui.rt=null;if(stack.length)try{history.back()}catch(e){stack.pop()}}};render();break;
    case'rday':{readForm();const k=+b.dataset.k,ds=ui.sheet.d.days;const j=ds.indexOf(k);if(j>=0)ds.splice(j,1);else ds.push(k);render();break}
    case'rdays':readForm();ui.sheet.d.days={all:[0,1,2,3,4,5,6],wk:[1,2,3,4,5],we:[0,6]}[b.dataset.v];render();break;
    case'subAdd':readForm();ui.sheet.d.subs.push({t:'',d:false});render();{const l=[...document.querySelectorAll('[data-sub]')].pop();l&&l.focus()}break;
    case'subDel':readForm();ui.sheet.d.subs.splice(+b.dataset.k,1);render();break;
    case'shx':if(e.target===b||b.tagName==='BUTTON'){ui.sheet=null;render()}break;
    case'day':ui.day=b.dataset.d;render();break;
    case'mode':ui.monthOpen=b.dataset.m==='1';render();break;
    case'shift':{const n=+b.dataset.n;if(ui.monthOpen){const d=parse(ui.day);d.setDate(1);d.setMonth(d.getMonth()+n);ui.day=ymd(d)}else ui.day=addD(ui.day,7*n);render();break}
    case'area':nav({area:id});break;
    case'areaNew':ui.sheet={kind:'area',d:{id:'',name:'',color:COLORS[S.areas.length%COLORS.length]}};render();break;
    case'areaEd':ui.sheet={kind:'area',d:Object.assign({},area(ui.area))};render();break;
    case'col':{const f=document.querySelector('form[data-f=area]');ui.sheet.d.name=f.querySelector('[name=n]').value;ui.sheet.d.color=b.dataset.c;render();break}
    case'areaDel':{const aid=ui.sheet.d.id;ui.sheet={kind:'confirm',title:'Apagar esta área?',text:'Os itens desta área ficam sem área, não são apagados.',ok:'Apagar área',fn:()=>{S.areas=S.areas.filter(x=>x.id!==aid);S.items.forEach(x=>{if(x.areaId===aid)x.areaId=''});S.routines.forEach(x=>{if(x.areaId===aid)x.areaId=''});ui.area=null;if(stack.length)try{history.back()}catch(e){stack.pop()}}};render();break}
    case'emo':readForm();ui.sheet.d.emoji=b.dataset.e;render();break;
    case'dur':readForm();ui.sheet.d.dur=+b.dataset.m;render();break;
    case'per':ui.per=+b.dataset.p;render();break;
    case'bk':ui.sheet={kind:'bk'};render();break;
    case'exp':{const bl=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='foco-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Ficheiro exportado');break}
    case'name':ui.sheet={kind:'name'};render();break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,k=f.dataset.f;
  if(k==='name'){S.name=f.querySelector('[name=n]').value.trim();ui.sheet=null;commit();return}
  if(k==='routine'){readForm();const d=ui.sheet.d;d.title=d.title.trim();if(!d.title)return;
    if(!d.days.length){toast('Escolhe pelo menos um dia');return}
    d.emoji=(d.emoji||'').trim();if(!d.start)d.start=today();d.log=d.log||{};
    if(d.id){const j=S.routines.findIndex(x=>x.id===d.id);d.log=S.routines[j].log||{};S.routines[j]=d}else{d.id=uid();S.routines.push(d)}
    ui.sheet=null;commit('Rotina guardada');return}
  if(k==='area'){const d=ui.sheet.d;d.name=f.querySelector('[name=n]').value.trim();if(!d.name)return;
    if(d.id)Object.assign(area(d.id),d);else S.areas.push(Object.assign(d,{id:uid()}));ui.sheet=null;commit('Área guardada');return}
  readForm();const d=ui.sheet.d;d.title=d.title.trim();if(!d.title)return;
  d.subs=d.subs.filter(s=>s.t.trim());d.emoji=(d.emoji||'').trim();
  if(d.type!=='task'){d.goalId='';d.dur=0}if(d.type!=='event')d.end='';if(d.type==='goal')d.time='';
  if(d.id){const i=S.items.findIndex(x=>x.id===d.id);S.items[i]=d}else{d.id=uid();S.items.push(d)}
  if(isDone(d)&&!d.doneAt)d.doneAt=today();ui.sheet=null;commit('Guardado');
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='imp'||!e.target.files[0])return;
  try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.areas)||!Array.isArray(d.items))throw 0;
    ui.sheet={kind:'confirm',title:'Substituir os dados atuais?',text:'Os dados deste dispositivo serão trocados pelos do ficheiro.',ok:'Importar',msg:'Dados importados',fn:()=>{S=d;fixS();ui.detail=null;ui.area=null;ui.rt=null}};render()}
  catch(_){toast('Ficheiro inválido')}
});
render();
}
</script>
</body>
</html>
